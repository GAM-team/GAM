name: Auto-Retry Failed Builds

on:
  workflow_run:
    workflows: ["Build and test GAM"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-failed:
    name: Re-run failed matrix jobs
    # Only retry if the run failed, and cap at 3 total attempts
    # to avoid burning through runner minutes endlessly.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 4 }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Retrying failed jobs for run: ${RUN_ID}"
          gh run rerun "${RUN_ID}" --failed
