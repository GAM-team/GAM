name: Build and test GAM

on:
  push:
    paths-ignore:
      - 'wiki/**'
  pull_request:
    paths-ignore:
      - 'wiki/**'
  schedule:
    - cron: '37 22 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' }}

permissions:
  contents: read
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash
    working-directory: src

env:
  SCRATCH_COUNTER: 16
  CRYPTOGRAPHY_BUILD_OPENSSL_NO_LEGACY: 1
  CRYPTOGRAPHY_OPENSSL_NO_LEGACY: 1
  WINDOWS_CODESIGN_CERT_HASH: F0525AB6343A5E9A5F75CF81FC56CF67E316CB28

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            freethreaded: false
            goal: build
            name: Build Intel Ubuntu Jammy
          - os: ubuntu-24.04
            freethreaded: false
            goal: build
            name: Build Intel Ubuntu Noble
          - os: ubuntu-26.04
            freethreaded: false
            goal: build
            name: Build Intel Ubuntu Resolute
          - os: ubuntu-24.04-arm
            freethreaded: false
            goal: build
            name: Build Arm Ubuntu Noble
          - os: ubuntu-22.04-arm
            freethreaded: false
            goal: build
            name: Build Arm Ubuntu Jammy
          - os: ubuntu-26.04-arm
            freethreaded: false
            goal: build
            name: Build Arm Ubuntu Resolute
          - os: ubuntu-22.04
            freethreaded: false
            goal: build
            staticx: yes
            name: Build Intel StaticX Legacy
          - os: ubuntu-22.04-arm
            freethreaded: false
            goal: build
            staticx: yes
            name: Build Arm StaticX Legacy
          - os: macos-15
            freethreaded: false
            goal: build
            name: Build Arm MacOS 15
          - os: macos-15-intel
            freethreaded: false
            goal: build
            name: Build x86_64 macOS 15
          - os: macos-26-intel
            freethreaded: false
            goal: build
            name: Build x86_64 macOS 26
          - os: macos-26
            freethreaded: false
            goal: build
            name: Build Arm MacOS 26
          - os: xcode-27
            freethreaded: false
            goal: build
            name: Build Arm MacOS 27
          - os: windows-2025-vs2026
            freethreaded: false
            goal: build
            name: Build Intel Windows
          - os: windows-11-arm
            freethreaded: false
            goal: build
            name: Build Arm Windows
          - os: ubuntu-26.04
            goal: test
            python: "3.11"
            freethreaded: false
            name: Test Python 3.11
          - os: ubuntu-26.04
            goal: test
            python: "3.12"
            freethreaded: false
            name: Test Python 3.12
          - os: ubuntu-26.04
            goal: test
            python: "3.13"
            freethreaded: false
            name: Test Python 3.13
          - os: ubuntu-26.04
            goal: test
            python: "3.14"
            freethreaded: false
            name: Test Python 3.14
          - os: ubuntu-26.04
            goal: test
            python: "3.15"
            freethreaded: true
            name: Test Python 3.15 freethread

    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/297925809119/locations/global/workloadIdentityPools/gha-pool/providers/gha-provider
          service_account: github-actions-testing-for-gam@gam-project-wyo-lub-ivl.iam.gserviceaccount.com
          access_token_scopes: https://www.googleapis.com/auth/iam

      - name: Setup Latest Python and OpenSSL
        if: matrix.goal == 'build'
        id: setup-python
        uses: jay0lee/python-openssl-latest@v1

      - name: Use pre-compiled Python for testing
        if: matrix.python != ''
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          check-latest: true
          freethreaded: ${{ matrix.freethreaded }}

      - name: common variables for all runs
        id: common-vars
        env:
          ACTIONS_GOAL: ${{ matrix.goal }}
          freethreaded: ${{ matrix.freethreaded }}
        run: |
          case $RUNNER_ARCH in
            X64)
              echo "arch=x86_64" >> $GITHUB_ENV
              ;;
            ARM64)
              echo "arch=arm64" >> $GITHUB_ENV
              ;;
            *)
              echo "arch=${RUNNER_ARCH}" >> $GITHUB_ENV
              ;;
          esac
          # calculate with python because date on MacOS is just stupid
          DEPS_CUTOFF=$(python3 -c "from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=14)).strftime('%Y-%m-%dT00:00:00Z'))")
          echo "DEPS_CUTOFF=${DEPS_CUTOFF}" >> $GITHUB_ENV
          export JID=$(( ${{ strategy.job-index }} + 1 ))
          echo "JID=${JID}" >> $GITHUB_ENV
          # We must also output JID so we can use it later in GH actions env outside the shell.
          echo "jid=${JID}" >> $GITHUB_OUTPUT
          echo "freethreaded=${freethreaded}" >> $GITHUB_ENV
          if "$freethreaded"; then
            # Hush some warnings while we test
            export PYTHON_GIL=0
            echo "PYTHON_GIL=${PYTHON_GIL}" >> $GITHUB_ENV
          fi
          echo "ACTIONS_GOAL=${ACTIONS_GOAL}" >> $GITHUB_ENV
          curl_version=$(curl --version | head -n 1 | awk '{ print $2 }')
          echo "cURL is ${curl_version}"
          if [ "$curl_version" == "7.68.0" ]; then
            export curl_retry="--retry 5 --retry-connrefused"
          else
            export curl_retry="--retry 5 --retry-all-errors"
          fi
          echo "curl_retry=${curl_retry}" >> $GITHUB_ENV
          # GAMCFGDIR should be recreated on every run
          GAMCFGDIR="${RUNNER_TEMP}/.gam"
          if [ "$RUNNER_OS" == "Windows" ]; then
            GAMCFGDIR=$(cygpath -u "$GAMCFGDIR")
          fi
          echo "GAMCFGDIR=${GAMCFGDIR}" >> $GITHUB_ENV
          echo "GAMCFGDIR is: ${GAMCFGDIR}"
          export GAMOS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          echo "GAMOS=${GAMOS}" >> $GITHUB_ENV
          echo "GAMOS is: ${GAMOS}"

      - name: Set env variables for test
        if: matrix.goal == 'test'
        run: |
          export PYTHON=$(which python3)
          export gampath="$(readlink -e .)/gam"
          echo -e "PYTHON: ${PYTHON}\ngam: ${gam}\ngampath: ${gampath}"
          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          echo "gampath=${gampath}" >> $GITHUB_ENV

      - name: Install necessary Github-hosted Linux packages
        if: runner.os == 'Linux'
        run: |
          echo "RUNNING: apt update..."
          sudo apt-get -qq --yes update
          sudo apt-get -qq --yes install swig libpcsclite-dev libxslt1-dev libsqlite3-dev libffi-dev pkg-config

      - name: MacOS install tools
        if: runner.os == 'macOS'
        run: |
          # Install latest Rust
          curl $curl_retry -fsS -o rust.sh https://sh.rustup.rs
          bash ./rust.sh -y
          source $HOME/.cargo/env
          # Install needed packages
          #brew update
          #brew install gpg
          #brew install swig
          #brew install ncurses

      - name: MacOS import developer certificates for signing
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@b610f78488812c1e56b20e6df63ec42d833f2d14 # v6.0.0
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
      
      - name: Set Env Variables for build
        if: matrix.goal == 'build'
        env:
          staticx: ${{ matrix.staticx }}
        run: |
          echo "We are running on ${RUNNER_OS}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | awk -F '.' '{print $1 "." $2}')
            echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}" >> $GITHUB_ENV
            echo "We are running on and targetting MacOS ${MACOSX_DEPLOYMENT_TARGET}"
          fi
          echo "staticx=${staticx}" >> $GITHUB_ENV
          echo "COMPILED_PYTHON_VERSION=${{ steps.setup-python.outputs.python-version }}" >> $GITHUB_ENV
          echo "COMPILED_OPENSSL_VERSION=${{ steps.setup-python.outputs.openssl-version }}" >> $GITHUB_ENV

      - name: Run Python
        run: |
          "${PYTHON}" -VV
          "${PYTHON}" -c "import ssl; print(f'Using {ssl.OPENSSL_VERSION}')"

      - name: Create and use Python .venv
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -o get-pip.py https://bootstrap.pypa.io/get-pip.py
          "$PYTHON" get-pip.py
          "$PYTHON" -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # pyscard seems to build outside venv but not in it.
            # build it so it's cached.
            "$PYTHON" -m pip install --upgrade pyscard
            export PYTHON="${GITHUB_WORKSPACE}/.venv/scripts/python.exe"
          else
            export PYTHON="${GITHUB_WORKSPACE}/.venv/bin/python3"
          fi
          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          if [[ "$ACTIONS_GOAL" == "test" ]]; then
            export gam="${PYTHON} gam.py"
            echo "gam=${gam}" >> $GITHUB_ENV
          fi

      - name: Install pip requirements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([ "$RUNNER_OS" == "Windows" ] && [ "$RUNNER_ARCH" == "ARM64" ]); then
            # custom cryptography wheel for win arm64 since the project doesn't provide one:
            # https://github.com/pyca/cryptography/issues/14293
            gh release download --repo "jay0lee/cryptography-wheels" --pattern "*[^t]-win_arm64.whl" --clobber
            "$PYTHON" -m pip install cryptography-*.whl
          elif [[ "$RUNNER_OS" == "macOS" && "$RUNNER_ARCH" == "x86_64" ]]; then
            # custom cryptography wheel for macos x86_64 since it's no longer standard
            gh release download --repo "jay0lee/cryptography-wheels" --pattern "*[^t]-macosx_15_0_x86_64.whl" --clobber
            "$PYTHON" -m pip install cryptography-*.whl
          fi
          "$PYTHON" -m pip install ..[yubikey]

      - name: Install PyInstaller
        if: matrix.goal == 'build'
        run: |
          # Install latest version of PyInstaller *that's 2 weeks old*
          # Calculate the exact timestamp for 14 days ago
          "$PYTHON" -m pip install --upgrade pyinstaller

      - name: Build GAM with PyInstaller
        if: matrix.goal != 'test'
        run: |
          export distpath="./dist/gam"
          mkdir -p -v "${distpath}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            # Tell our gam.spec to use our code sign certificate
            export codesign_identity="Jay Lee"
           # Point to our compiled OpenSSL so PyInstaller picks it up
           # instead of Homebrew's version, without breaking pip cryptography
            export DYLD_LIBRARY_PATH="${OPENSSL_INSTALL_PATH}/lib:${DYLD_LIBRARY_PATH:-}"
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Work around issue where PyInstaller picks up python3.dll from other Python versions
            # https://github.com/pyinstaller/pyinstaller/issues/7102
            export PATH="$(dirname ${PYTHON}):/usr/bin"
          fi
          if [[ "$staticx" != "yes" ]]; then
            export PYINSTALLER_BUILD_ONEDIR=yes
          fi
          "${PYTHON}" -m PyInstaller --clean --noconfirm --distpath="${distpath}" gam.spec
          if [[ "$PYINSTALLER_BUILD_ONEDIR" == "yes" ]]; then
            mv -v "${distpath}/gam" "${distpath}/gam7"
            export gampath="${distpath}/gam7"
          else
            mv -v "$distpath" "${distpath}7"
            export gampath="${distpath}7"
          fi
          export gampath=$(realpath "$gampath")
          echo "gampath ${gampath} results:"
          ls -alRF "$gampath"
          echo "---- WARNINGS FROM build/gam/warn-gam.txt"
          cat build/gam/warn-gam.txt
          echo "---- Analysis FROM build/gam/Analysis-00.toc"
          cat build/gam/Analysis-00.toc
          echo "---- EXE data FROM build/gam/EXE-00.toc"
          cat build/gam/EXE-00.toc
          export gam="${gampath}/gam"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export gam=$(cygpath -w "$gam")
            echo "GAM on Windows at ${gam}"
          else
            export gam=$(realpath "$gam")
          fi
          echo "gampath=${gampath}" >> $GITHUB_ENV
          echo "gam=${gam}" >> $GITHUB_ENV
          echo -e "GAM: ${gam}\nGAMPATH: ${gampath}"

      - name: Copy extra package files
        if: matrix.goal == 'build'
        run: |
          cp -v gam/cacerts.pem "$gampath"
          cp -v LICENSE "$gampath"
          cp -v GamCommands.txt "$gampath"
          cp -v GamUpdate.txt "$gampath"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
              cp -v gam-setup.bat "$gampath"
          fi

      - name: Install StaticX
        if: matrix.staticx == 'yes'
        run: |
          sudo apt-get -qq --yes update
          # arm64 needs to build a wheel and needs scons to build
          sudo apt-get -qq --yes install scons
          "$PYTHON" -m pip install --upgrade patchelf-wrapper
          "$PYTHON" -m pip install --upgrade typing_extensions
          "$PYTHON" -m pip install --upgrade staticx

      - name: Make StaticX GAM build
        if: matrix.staticx == 'yes'
        run: |
          case $RUNNER_ARCH in
            X64)
              ldlib=/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
              ;;
            ARM64)
              ldlib=/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1
              ;;
          esac
          echo "ldlib=${ldlib}"
          $PYTHON -m staticx -l "${ldlib}" "$gam" "${gam}-staticx"
          rm -v "$gam"
          mv -v "${gam}-staticx" "$gam"

      - name: MacOS send GAM binary for Apple notarization
        if: runner.os == 'macOS'
        env:
          APPLE_KEY: ${{ secrets.APPLE_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          # Apple wants some kind of "package" submitted so just add gam to a .zip
          # name it something we can track and link in Apple's notarize process
          zipfilename="./gam-${RUNNER_ARCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}.zip"
          zip -r "$zipfilename" "$gampath"
          export KEY_FILE="$(mktemp).p8"
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "$APPLE_KEY" > "$KEY_FILE"
          xcrun notarytool submit "$zipfilename" --key "$KEY_FILE" --key-id "$APPLE_KEY_ID" --issuer "$APPLE_ISSUER_ID"
          rm -v "$KEY_FILE"
          rm -v "$zipfilename"

      - name: Basic Tests all jobs
        id: basictests
        run: |
          $gam version extended nooffseterror
          export GAMVERSION=$($gam version simple)
          echo "GAM Version ${GAMVERSION}"
          echo "GAMVERSION=${GAMVERSION}" >> $GITHUB_ENV

      - name: Setup Certum Code Signing
        id: certum
        if: runner.os == 'Windows'
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # v1
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.TOTP_SECRET }}
          cert_sha1: ${{ env.WINDOWS_CODESIGN_CERT_HASH }}
          debug: 'false'

      - name: Sign gam.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          write-Host "Certs:"
          Get-ChildItem -Path Cert:\CurrentUser\My | Format-List *
          write-Host "Preparing to sign files in ${env:gampath}...."

          # Convert gampath so Powershell is happy
          $env:gampath = cygpath -w $env:gampath

          # Always explicitely use x64 version os signtool.exe, arm64 version apparently can't
          # see Certum certs since SimplySignDesktop is x64-only today.

          # sign all executable files not just exe
          $files = Get-ChildItem -Path "${env:gampath}" -Recurse -Include *.exe, *.dll, *.pyd
          
          # Collect files that actually need signing
          $filesToSign = @()
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            # Only sign the file if it does not already have a valid signature
            if ($sig.Status -eq 'NotSigned' -or $sig.Status -eq 'HashMismatch') {
              $filesToSign += $file.FullName
            }
            else {
              Write-Host "Skipping $($file.Name) - Already signed by $($sig.SignerCertificate.Subject)"
            }
          }

          # Batch sign the collected files
          if ($filesToSign.Count -gt 0) {
            Write-Host "Batch signing $($filesToSign.Count) files..."
            
            $signtool = "${{ steps.certum.outputs.signtool-path }}"
            $thumbprint = "${{ steps.certum.outputs.cert-thumbprint }}"
            
            # Chunk the files to avoid the 32,767 character command-line limit in Windows
            $chunkSize = 50
            for ($i = 0; $i -lt $filesToSign.Count; $i += $chunkSize) {
              $upperBound = [Math]::Min($i + $chunkSize - 1, $filesToSign.Count - 1)
              $chunk = $filesToSign[$i..$upperBound]
              Write-Host "Signing chunk ($($chunk.Count) files)..."
              
              $baseArgs = @("sign", "/sha1", $thumbprint, "/tr", "http://time.certum.pl", "/td", "SHA256", "/fd", "SHA256", "/v")
              $allArgs = $baseArgs + $chunk
              
              Start-Process -Wait -NoNewWindow -ErrorAction Continue -FilePath $signtool -ArgumentList $allArgs
            }
          }
          else {
            Write-Host "No files require signing."
          }

          write-Host "Verifying signature of ${env:gam}...."
          # verify signature using dynamic signtool path
          & "${{ steps.certum.outputs.signtool-path }}" verify /pa /v "$env:gam"

      - name: Configure user and service account auth
        id: configserviceaccount
        env:
          oa2: ${{ secrets[format('GAM_GHA_{0}', steps.common-vars.outputs.jid)] }}
        run: |
          ../.github/actions/decrypt.sh "${GAMCFGDIR}"
          for attempt in 1 2 3; do
            if $gam create signjwtserviceaccount; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::Failed to create SignJWT service account after 3 attempts" >&2
              exit 1
            fi
            sleep_s=$(( attempt * 4 + (RANDOM % 5) + 1 ))
            echo "::warning::create signjwtserviceaccount failed (attempt ${attempt}/3); retrying in ${sleep_s}s..." >&2
            sleep "${sleep_s}"
          done

      - name: Attest gam executable was generated from this Action
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        if: matrix.goal == 'build'
        with:
          subject-path: ${{ env.gam }}

      - name: Linux/MacOS package
        if: runner.os != 'Windows' && matrix.goal == 'build'
        run: |
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
              GAM_ARCHIVE="${GITHUB_WORKSPACE}/gam-${GAMVERSION}-macos${MACOSX_DEPLOYMENT_TARGET}-${arch}.tar.xz"
          elif [[ "${RUNNER_OS}" == "Linux" ]]; then
            if [[ "${staticx}" == "yes" ]]; then
              libver="legacy"
            else
              libver="glibc$(ldd --version | awk '/ldd/{print $NF}')"
            fi
            GAM_ARCHIVE="${GITHUB_WORKSPACE}/gam-${GAMVERSION}-linux-${arch}-${libver}.tar.xz"
          fi
          echo "GAM Archive ${GAM_ARCHIVE}"
          tar -C "${gampath}/.." --create --verbose --exclude-from "${GITHUB_WORKSPACE}/.github/actions/package_exclusions.txt" --file $GAM_ARCHIVE --xz gam7

      - name: Windows package zip
        if: runner.os == 'Windows' && matrix.goal != 'test'
        run: |
          echo "started in $(pwd)"
          cd "${gampath}/.."
          echo "moved to $(pwd)"
          GAM_ARCHIVE="${GITHUB_WORKSPACE}/gam-${GAMVERSION}-windows-${arch}.zip"
          /c/Program\ Files/7-Zip/7z.exe a -tzip "$GAM_ARCHIVE" gam7 "-xr@${GITHUB_WORKSPACE}/.github/actions/package_exclusions.txt" -bb3

      - name: Windows package exe with Inno Setup
        if: runner.os == 'Windows' && matrix.goal != 'test'
        run: |
          choco install innosetup
          iscc \
            /S"gamsigntool=$CERTUM_SIGNTOOL_PATH sign /sha1 $WINDOWS_CODESIGN_CERT_HASH /tr http://time.certum.pl /td SHA256 /fd SHA256 /v \$f" \
            /O"$GITHUB_WORKSPACE" \
            gam.iss

      - name: Attest that gam package files were generated from this Action
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.goal == 'build'
        with:
          subject-path: |
            gam*.tar.xz
            gam*.zip
            gam*.exe

      - name: Archive tar.xz artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        if: runner.os != 'Windows'
        with:
          archive: false
          if-no-files-found: ignore
          path: |
            gam*.tar.xz

      - name: Archive zip artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        if: runner.os == 'Windows'
        with:
          archive: false
          if-no-files-found: ignore
          path: |
            gam*.zip

      - name: Archive exe artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        if: runner.os == 'Windows'
        with:
          archive: false
          if-no-files-found: ignore
          path: |
            gam*.exe

      - name: Teardown SimplySign Desktop Session
        if: always() && runner.os == 'Windows'
        uses: jay0lee/certum-cloud-code-sign/teardown@a3324503499c49090869856eeeecfe95fb613d87 # v1

      - name: Basic Tests build jobs only
        if: matrix.goal != 'test'
        run: |
          export voutput=$($gam version extended nooffseterror)
          export python_line=$(echo -e "${voutput}" | grep "Python ")
          export python_arr=($python_line)
          export this_python=${python_arr[1]}
          if [[ "${this_python}" != "${COMPILED_PYTHON_VERSION}" ]]; then
            echo "ERROR: Tried to compile Python ${COMPILED_PYTHON_VERSION} but ended up with ${this_python}"
            exit 1
          fi
          export openssl_line=$(echo -e "${voutput}" | grep "OpenSSL ")
          export openssl_arr=($openssl_line)
          export this_openssl="${openssl_arr[1]}"
          if [[ "${this_openssl}" != "${COMPILED_OPENSSL_VERSION}" ]]; then
            echo "ERROR: Tried to compile OpenSSL ${COMPILED_OPENSSL_VERSION} but ended up with ${this_openssl}"
            exit 1
          fi
          echo "We successfully compiled Python ${this_python} and OpenSSL ${this_openssl}"

      - name: Live API tests
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          bash ../.github/actions/live-tests.sh

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: gam-binaries/
          merge-multiple: true
          skip-decompress: true

      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@d34968c958ae283fe976efed637081b9f9dcf74f # 4.2.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            gam-binaries/*

      - name: Set datetime version string
        id: dateversion
        run: |
          export dateversion="$(date  +'%Y%m%d.%H%M%S')"
          echo "Date version: ${dateversion}"
          echo "dateversion=${dateversion}" >> $GITHUB_OUTPUT

      - name: Publish draft release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          draft: true
          prerelease: false
          tag_name: "${{ steps.dateversion.outputs.dateversion }}"
          fail_on_unmatched_files: true
          files: |
            gam-binaries/*

