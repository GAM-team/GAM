[project]
name = "gam7"
dynamic = [
    "version",
]
authors = [
    { name = "Jay Lee", email = "jay0lee@gmail.com" },
    { name = "Ross Scroggs", email = "Ross.Scroggs@gmail.com" },
]
dependencies = [
    "arrow==1.4.0",
    "chardet==7.6.0",
    "cryptography==50.0.2",
    "distro==1.9.0 ; sys_platform=='linux'",
    "filelock==4.0.7",
    "google-api-python-client==2.201.0",
    "google-auth-httplib2==0.4.3",
    "google-auth-oauthlib @ git+https://github.com/jay0lee/google-cloud-python.git@dpop-oauthlib#subdirectory=packages/google-auth-oauthlib",
    "google-auth @ git+https://github.com/jay0lee/google-cloud-python.git@dpop-oauthlib#subdirectory=packages/google-auth",
    "modern-httplib2==1.32.0.post2",
    "lxml==6.1.3",
    "passlib==1.7.4",
    "pathvalidate==3.3.1",
    "pysocks==1.7.1",
]
description = "CLI tool to manage Google Workspace"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
license-files = [
    "LICEN[CS]E*",
]

[project.license]
text = "Apache License (2.0)"

[project.optional-dependencies]
yubikey = [
    "dpop-signer-yubikey @ git+https://github.com/jay0lee/dpop-signers.git#subdirectory=yubikey",
]
ecp = [
    "dpop-signer-ecp @ git+https://github.com/jay0lee/dpop-signers.git#subdirectory=ecp",
]
macos_secureenclave = [
    "dpop-signer-macos-secureenclave @ git+https://github.com/jay0lee/dpop-signers.git#subdirectory=macos-secureenclave",
]
linux_tpm = [
    "dpop-signer-linux-tpm @ git+https://github.com/jay0lee/dpop-signers.git#subdirectory=linux-tpm",
]
windows_tpm = [
    "dpop-signer-windows-tpm @ git+https://github.com/jay0lee/dpop-signers.git#subdirectory=windows-tpm",
]

[project.scripts]
gam = "gam.__main__:main"

[project.urls]
Homepage = "https://github.com/GAM-team/GAM"
Issues = "https://github.com/GAM-team/GAM/issues"
Discussion = "https://groups.google.com/group/google-apps-manager"
Chat = "https://git.io/gam-chat"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/gam/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gam",
]

[build-system]
requires = [
    "hatchling<1.30.0",
]
build-backend = "hatchling.build"
